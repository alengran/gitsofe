        let categories = siteData.categories;

        let expandedCategories = new Set();

        function init() {
            renderPageMeta();
            renderSidebar();
            renderFooter();
            loadRecommendedList();

            // 检查 URL 参数，如果有 slug 则显示对应软件
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug');
            if (slug) {
                setTimeout(() => loadSoftwareBySlug(slug), 100);
            }
        }

        function loadSoftwareBySlug(slug) {
            for (const cat of categories) {
                const software = cat.softwareList.find(s => s.slug === slug);
                if (software) {
                    expandedCategories.add(cat.id);
                    currentSelected = { categoryId: cat.id, softwareId: software.id };
                    renderSidebar();
                    renderSoftwareDetail();
                    hideDefaultContent();
                    return true;
                }
            }
            return false;
        }

        function hideDefaultContent() {
            const defaultContent = document.getElementById('defaultContent');
            if (defaultContent) {
                defaultContent.style.display = 'none';
            }
        }

        function renderPageMeta() {
            const urlParams = new URLSearchParams(window.location.search);
            if (!urlParams.get('slug')) {
                document.title = settings.site_title || '软件库 - 专业软件推荐';
            }
            document.getElementById('siteLogo').textContent = settings.site_logo_text || '🧩 软件优选站';
            document.getElementById('siteSlogan').textContent = settings.site_slogan || '高效 · 纯净 · 专业软件管家';
        }

        function renderSidebar() {
            const container = document.getElementById('categoryList');
            container.innerHTML = '';

            categories.forEach(cat => {
                const li = document.createElement('li');
                li.className = 'category-item';

                const isExpanded = expandedCategories.has(cat.id);
                const titleDiv = document.createElement('div');
                titleDiv.className = 'category-title';
                titleDiv.innerHTML = `
                    <span class="category-name">📁 ${escapeHtml(cat.name)}</span>
                    <span class="arrow ${isExpanded ? 'expanded' : ''}">▶</span>
                `;

                const subUl = document.createElement('ul');
                subUl.className = `software-sublist ${isExpanded ? 'show' : ''}`;

                cat.softwareList.forEach(soft => {
                    const softLi = document.createElement('li');
                    const isActive = currentSelected.categoryId === cat.id && currentSelected.softwareId === soft.id;
                    softLi.className = `software-item ${isActive ? 'active' : ''}`;

                    const numberDisplay = soft.software_number ? `#${soft.software_number} ` : '';
                    const iconDisplay = soft.icon ? `<img src="${soft.icon}" class="software-icon" alt="">` : '';

                    softLi.innerHTML = `${iconDisplay}<span>${numberDisplay}${escapeHtml(soft.name)}</span>`;
                    softLi.onclick = () => selectSoftware(cat.id, soft.id);
                    subUl.appendChild(softLi);
                });

                titleDiv.onclick = () => {
                    if (expandedCategories.has(cat.id)) {
                        expandedCategories.delete(cat.id);
                    } else {
                        expandedCategories.add(cat.id);
                    }
                    renderSidebar();
                };

                li.appendChild(titleDiv);
                li.appendChild(subUl);
                container.appendChild(li);
            });
        }

        function selectSoftware(categoryId, softwareId) {
            currentSelected = { categoryId, softwareId };
            renderSidebar();
            renderSoftwareDetail();
            hideDefaultContent();

            const category = categories.find(c => c.id === categoryId);
            const software = category?.softwareList.find(s => s.id === softwareId);
            if (software && software.slug) {
                const newUrl = window.location.pathname + '?slug=' + encodeURIComponent(software.slug);
                history.pushState({ categoryId, softwareId }, software.name, newUrl);
            }
        }

        function showDefaultContent() {
            currentSelected = { categoryId: null, softwareId: null };
            renderSidebar();
            history.pushState({ categoryId: null, softwareId: null }, '', window.location.pathname);

            document.title = settings.site_title || '软件库 - 专业软件推荐';

            let defaultContent = document.getElementById('defaultContent');
            const contentArea = document.getElementById('contentArea');

            if (!defaultContent) {
                contentArea.innerHTML = `
                    <div class="default-content" id="defaultContent">

                        </div>
                    </div>
                `;
                loadRecommendedList();
            } else {
                defaultContent.style.display = 'block';
                const existingDetail = document.querySelector('.software-detail');
                if (existingDetail) {
                    existingDetail.remove();

            }
        }

        function renderSoftwareDetail() {
            const contentDiv = document.getElementById('contentArea');
            const category = categories.find(c => c.id === currentSelected.categoryId);
            const software = category?.softwareList.find(s => s.id === currentSelected.softwareId);

            const existingDetail = document.querySelector('.software-detail');
            if (existingDetail) {
                existingDetail.remove();
            }

            if (!software) {
                return;
            }

            document.title = `${software.name} - ${category?.name || ''} - ${settings.site_title || '软件库'}`;

            const iconDisplay = software.icon ? `<img src="${software.icon}" class="software-detail-icon" alt="">` : '';

            contentDiv.innerHTML = `
                <div class="software-detail">
                    <button class="back-button" onclick="showDefaultContent()"><span>← 返回推荐</span></button>
                    <h2>${iconDisplay}✨ ${software.software_number ? `<span style="color:#3b82f6;font-weight:600;">#${escapeHtml(software.software_number)}</span> ` : ''}${escapeHtml(software.name)}</h2>
                    <div class="detail-description">${escapeHtml(software.description).replace(/\n/g, '<br>')}</div>
                    <div id="versionContainer">加载版本信息...</div>
                </div>
            `;

            // 处理版本和网盘链接
            renderVersionContent(software);

            // 加载截图
            if (software.screenshots && software.screenshots.length > 0) {
                renderScreenshots(software.screenshots);

        function renderVersionContent(software) {
            const container = document.getElementById('versionContainer');
            if (!container) return;

            const panConfig = {
                baidu: { name: '百度网盘', icon: '☁️', class: 'baidu' },
                quark: { name: '夸克网盘', icon: '⚡', class: 'quark' },
                '123pan': { name: '123云盘', icon: '🔢', class: 'other' },
                aliyun: { name: '阿里云盘', icon: '📦', class: 'aliyun' },
                lanzou: { name: '蓝奏云', icon: '🔵', class: 'lanzou' },
                xunlei: { name: '迅雷网盘', icon: '⚡', class: 'other' },
                other: { name: '其他网盘', icon: '🔗', class: 'other' }
            };

            let html = '';

            // 如果有版本数据，显示版本选择器
            if (software.versions && software.versions.length > 0) {
                const latestVersion = software.versions.find(v => v.is_latest === 1) || software.versions[0];

                html += `<div class="version-selector">
                    <h3>📚 选择版本</h3>
                    <div class="version-tabs">`;

                software.versions.forEach(version => {
                    const isLatest = version.is_latest ? '<span class="version-tab-badge">最新</span>' : '';
                    html += `<div class="version-tab ${version.is_latest ? 'active' : ''}">
                        <span>${escapeHtml(version.version_name)}</span>
                        ${isLatest}
                    </div>`;
                });

                html += `</div>`;

                if (latestVersion.description || latestVersion.version_number) {
                    html += `<div style="background: white; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 15px;">
                        <div style="font-weight: 600; color: #1e293b; margin-bottom: 10px;">
                            ${latestVersion.is_latest ? '<span style="color: #22c55e;">⭐ 最新版本</span>' : ''}
                            ${latestVersion.version_number ? `<span>${escapeHtml(latestVersion.version_number)}</span>` : ''}
                        </div>
                        ${latestVersion.description ? `<div style="color: #64748b; font-size: 0.9rem; line-height: 1.5;">${escapeHtml(latestVersion.description)}</div>` : ''}
                    </div>`;
                }

                // 处理版本网盘链接
                if (latestVersion.pan_links) {
                    html += renderPanLinks(latestVersion.pan_links, software.name, latestVersion.version_name, panConfig, latestVersion.id);
                }

                if (latestVersion.download_url) {
                    html += `<a href="${escapeHtml(latestVersion.download_url)}" target="_blank" class="official-link">🌐 官方网站</a>`;
                }

                html += `</div>`;
            } else {
                // 没有版本数据，直接显示软件的下载链接
                if (software.download_url) {
                    html += `<a href="${escapeHtml(software.download_url)}" target="_blank" class="official-link">🌐 官方网站</a>`;
                }

                // 处理软件网盘链接
                if (software.pan_links) {
                    html += `<div class="download-section">
                        <h3>📥 ${escapeHtml(software.name)} 网盘下载</h3>`;
                    html += renderPanLinks(software.pan_links, software.name, '', panConfig, software.id);
                    html += `</div>`;
                }
            }

            container.innerHTML = html;
        }

        function renderPanLinks(panLinksJson, softwareName, versionName, panConfig, uniqueId) {
            let html = '<div class="pan-links-container">';

            try {
                const panData = JSON.parse(panLinksJson);
                const panLinks = Object.values(panData).filter(pan => pan.url);

                if (panLinks.length > 0) {
                    panLinks.forEach((pan, index) => {
                        const config = panConfig[pan.type] || panConfig.other;
                        const uniqueIndex = `${uniqueId}_${index}`;

                        html += `
                            <div class="pan-link-card ${config.class}">
                                <div class="pan-link-header">
                                    <span class="pan-link-icon">${config.icon}</span>
                                    <span>${config.name}</span>
                                </div>
                                <div class="pan-link-body">
                                    <a href="${escapeHtml(pan.url)}" target="_blank" class="pan-link-btn-small">
                                        <span>🔗 点击下载</span>
                                    </a>
                                    ${pan.code ? `
                                        <div class="pan-code-row">
                                            <span class="pan-code-label">提取码:</span>
                                            <span class="pan-code-value" id="code_${uniqueIndex}">${escapeHtml(pan.code)}</span>
                                            <button class="copy-code-btn" onclick="copyCode('code_${uniqueIndex}', this)">📋 复制</button>
                                        </div>
                                    ` : '<div style="color: rgba(255,255,255,0.6); font-size: 0.85rem; font-style: italic; padding-top: 4px;">无需提取码</div>'}
                                </div>
                            </div>
                        `;
                    });
                }
            } catch (e) {
                console.error('解析网盘链接失败:', e);
            }

            html += '</div>';
            return html;
        }

        function renderScreenshots(screenshots) {
            const container = document.getElementById('versionContainer');
            if (!container) return;

            const screenshotsSection = document.createElement('div');
            screenshotsSection.className = 'software-screenshots';

            const screenshotsGrid = document.createElement('div');
            screenshotsGrid.className = 'screenshots-grid';

            screenshots.forEach(shot => {
                const thumb = document.createElement('div');
                thumb.className = 'screenshot-thumb';
                thumb.onclick = () => openScreenshotLightbox(shot.image_url);

                const img = document.createElement('img');
                img.src = shot.image_url;
                img.alt = '软件截图';

                thumb.appendChild(img);
                screenshotsGrid.appendChild(thumb);
            });

            screenshotsSection.innerHTML = '<h3>📸 软件截图</h3>';
            screenshotsSection.appendChild(screenshotsGrid);

            container.parentNode.insertBefore(screenshotsSection, container.nextSibling);
        }

        function openScreenshotLightbox(imageUrl) {
            const lightbox = document.getElementById('screenshotLightbox');
            const img = document.getElementById('lightboxImage');
            img.src = imageUrl;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeScreenshotLightbox() {
            const lightbox = document.getElementById('screenshotLightbox');
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeScreenshotLightbox();
            }
        });

        function copyCode(elementId, button) {
            const codeElement = document.getElementById(elementId);
            const code = codeElement.textContent;

            if (navigator.clipboard) {
                navigator.clipboard.writeText(code).then(() => {
                    showCopySuccess(button);
                }).catch(() => {
                    fallbackCopy(code, button);
                });
            } else {
                fallbackCopy(code, button);
            }
        }

        function fallbackCopy(text, button) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();

            try {
                document.execCommand('copy');
                showCopySuccess(button);
            } catch (err) {
                console.error('复制失败:', err);
                button.textContent = '❌ 复制失败';
                setTimeout(() => {
                    button.textContent = '📋 复制';
                }, 2000);
            }

            document.body.removeChild(textarea);
        }

        function showCopySuccess(button) {
            const originalText = button.textContent;
            button.textContent = '✅ 已复制';
            button.classList.add('copied');

            setTimeout(() => {
                button.textContent = originalText;
                button.classList.remove('copied');
            }, 2000);
        }

        function renderFooter() {
            const footerEl = document.getElementById('footerCopyright');
            let linkHtml = '';
            if (settings.copyright_link_text && settings.copyright_link_url) {
                linkHtml = ` | <a href="${escapeHtml(settings.copyright_link_url)}" target="_blank">${escapeHtml(settings.copyright_link_text)}</a>`;
            }
            footerEl.innerHTML = `<div>${escapeHtml(settings.copyright_text || '')} ${linkHtml}</div>`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
                return map[m];
            });
        }

        function loadRecommendedList() {
            // 收集所有推荐软件
            const recommendedSoftware = [];
            categories.forEach(cat => {
                cat.softwareList.forEach(soft => {
                    if (soft.is_recommended) {
                        recommendedSoftware.push({
                            ...soft,
                            categoryName: cat.name
                        });
                    }
                });
            });

            // 按推荐排序和序号排序
            recommendedSoftware.sort((a, b) => {
                if (a.recommend_order !== b.recommend_order) {
                    return a.recommend_order - b.recommend_order;
                }
                return (a.software_number || '999') - (b.software_number || '999');
            });

            renderRankList(recommendedSoftware);
        }

            const container = document.getElementById('rankList');

            if (!items || items.length === 0) {
                container.innerHTML = '<div class="empty-rank">暂无推荐软件</div>';
                return;
            }

            container.innerHTML = '';

            items.forEach((soft, index) => {
                const div = document.createElement('div');
                div.className = 'rank-item';
                div.onclick = () => {
                    const category = categories.find(c => c.name === soft.categoryName);
                    if (category) {
                        expandedCategories.add(category.id);
                        currentSelected = { categoryId: category.id, softwareId: soft.id };
                        renderSidebar();
                        renderSoftwareDetail();
                        const defaultContent = document.getElementById('defaultContent');
                        if (defaultContent) {
                            defaultContent.style.display = 'none';
                        }
                        if (soft.slug) {
                            const newUrl = window.location.pathname + '?slug=' + encodeURIComponent(soft.slug);
                            history.pushState({ categoryId: category.id, softwareId: soft.id }, soft.name, newUrl);
                        }
                    }
                };

                div.innerHTML = `
                    <div class="rank-header">
                        <div class="rank-info">
                            ${soft.software_number ? `<div class="rank-number">#${escapeHtml(soft.software_number)}</div>` : `<div class="rank-number">${index + 1}</div>`}
                            <div class="rank-name">${escapeHtml(soft.name)}</div>
                        </div>
                    </div>
                    ${soft.description ? `<div class="rank-desc">${escapeHtml(soft.description)}</div>` : ''}
                `;
                container.appendChild(div);
            });
        }

        function showRecommended() {
            showDefaultContent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 搜索功能
        let searchTimeout = null;

        function handleSearch(event) {
            clearTimeout(searchTimeout);

            const query = event.target.value.trim();

            if (event.key === 'Escape') {
                showRecommended();
                document.getElementById('searchInput').value = '';
                return;
            }

            if (event.key === 'Enter') {
                performSearch(query);
                return;
            }

            if (/^\d+$/.test(query) && query.length >= 1) {
                searchTimeout = setTimeout(() => {
                    performSearch(query);
                }, 100);
                return;
            }

            if (query.length < 2) {
                showRecommended();
                return;
            }

            searchTimeout = setTimeout(() => {
                performSearch(query);
            }, 500);
        }

        function performSearch(query) {
            clearTimeout(searchTimeout);

            if (!query || query.length < 1) {
                showRecommended();
                return;
            }

            const searchQuery = query.toLowerCase().trim();
            const results = [];

            categories.forEach(cat => {
                cat.softwareList.forEach(soft => {
                    const matchNumberExact = soft.software_number && soft.software_number.toString() === searchQuery;
                    const matchNumberPartial = soft.software_number && soft.software_number.toString().includes(searchQuery);
                    const matchName = soft.name && soft.name.toLowerCase().includes(searchQuery);
                    const matchDesc = soft.description && soft.description.toLowerCase().includes(searchQuery);

                    if (matchNumberExact || matchName || matchDesc || matchNumberPartial) {
                        results.push({
                            ...soft,
                            categoryName: cat.name,
                            categoryId: cat.id,
                            isExactMatch: matchNumberExact
                        });
                    }
                });
            });

            results.sort((a, b) => {
                if (a.isExactMatch && !b.isExactMatch) return -1;
                if (!a.isExactMatch && b.isExactMatch) return 1;
                return 0;
            });

            displaySearchResults(results, query);
        }

        function displaySearchResults(results, query) {
            const contentArea = document.getElementById('contentArea');

            if (!contentArea) {
                console.error('内容区域未找到');
                return;
            }

            hideDefaultContent();

            const existingDetail = document.querySelector('.software-detail');
            if (existingDetail) {
                existingDetail.remove();
            }

            if (results.length === 0) {
                contentArea.innerHTML = `
                    <div class="default-content">
                        <div class="welcome-section">
                            <h2>🔍 搜索结果</h2>
                            <p>未找到序号或名称匹配 "${escapeHtml(query)}" 的软件</p>
                        </div>
                        <div class="empty-tip">
                            <p>💡 提示：</p>
                            <p style="margin-top: 10px;">• 输入序号（如 1、2、3）快速查找软件</p>
                            <p>• 输入软件名称或描述关键词搜索</p>
                        </div>
                    </div>
                `;
            } else {
                const exactMatch = results.find(r => r.isExactMatch);
                const resultText = exactMatch
                    ? `找到序号 #${escapeHtml(query)} 对应的软件`
                    : `找到 ${results.length} 个匹配"${escapeHtml(query)}"的结果`;

                contentArea.innerHTML = `
                    <div class="default-content">
                        <div class="welcome-section">
                            <h2>🔍 搜索结果</h2>
                            <p>${resultText}</p>
                        </div>
                        <div class="rank-grid" id="searchResultsGrid"></div>
                    </div>
                `;

                const grid = document.getElementById('searchResultsGrid');
                results.forEach((soft, index) => {
                    const div = document.createElement('div');
                    div.className = 'rank-item';
                    if (soft.isExactMatch) {
                        div.style.background = 'linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%)';
                        div.style.borderColor = '#22c55e';
                    }
                    div.onclick = () => {
                        expandedCategories.add(soft.categoryId);
                        currentSelected = { categoryId: soft.categoryId, softwareId: soft.id };
                        renderSidebar();
                        renderSoftwareDetail();
                        hideDefaultContent();
                        if (soft.slug) {
                            const newUrl = window.location.pathname + '?slug=' + encodeURIComponent(soft.slug);
                            history.pushState({ categoryId: soft.categoryId, softwareId: soft.id }, soft.name, newUrl);
                        }
                    };

                    div.innerHTML = `
                        <div class="rank-header">
                            <div class="rank-info">
                                ${soft.software_number ? `<div class="rank-number">#${escapeHtml(soft.software_number)}</div>` : `<div class="rank-number">${index + 1}</div>`}
                                <div class="rank-name">${escapeHtml(soft.name)}</div>
                            </div>
                            ${soft.isExactMatch ? '<span style="background: #22c55e; color: white; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600;">精确匹配</span>' : ''}
                        </div>
                        ${soft.description ? `<div class="rank-desc">${escapeHtml(soft.description)}</div>` : ''}
                        <div style="margin-top: 10px; font-size: 0.85rem; color: #94a3b8;">📁 ${escapeHtml(soft.categoryName)}</div>
                    `;
                    grid.appendChild(div);
                });
            }
        }

        // 监听浏览器后退/前进按钮
        window.addEventListener('popstate', function(event) {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug');

            if (slug) {
                loadSoftwareBySlug(slug);
            } else {
                showDefaultContent();
            }
        });

        // 初始化页面
        init();
    </script>
</body>
</html>
